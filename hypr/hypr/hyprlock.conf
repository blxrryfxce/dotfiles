# ~/.config/hypr/hyprlock.conf
$font = DepartureMono Nerd Font Propo
$locked = 
$check = 󰣯
$fail = 󱙱
$clock = 
$pwroff = 
$reboot = 󰜉
$sleep = 󰤄

general {
    hide_cursor = false
}


animations {
    enabled = true

    bezier = easeOut, 0.16, 1, 0.3, 1
    bezier = easeInOut, 0.65, 0, 0.35, 1

    # Lock screen fading in/out
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeInOut

    # Password dots
    animation = inputFieldDots, 1, 3, easeOut

    # Password field color transitions
    animation = inputFieldColors, 1, 3, easeOut

    # Input field width changes
    animation = inputFieldWidth, 1, 3, easeOut
}

image {
    monitor =
    path = ~/.config/images/pfp.png
    size = 150, 20
    rounding = -1                    
    border_size = 4
    border_color = rgba(216, 216, 216, 0.8)
    rotate = 0                                  

    position = 0, 80
    halign = center
    valign = center
}

background {
    monitor =
    # Use 'screenshot' or path to a png file
    path = screenshot
    color = rgba(25, 20, 20, 1.0)

    # Blur options taken from Hyprland
    blur_passes = 3
    blur_size = 2
    vibrancy = 0.1696
}

# USER
label {
    monitor =
    text =  $USER
    color = rgba(255, 255, 255, 0.8)
    outline_color = rgb(10, 10, 10)
    outline_thickness = 2
    font_size = 22
    font_family = $font
    position = 0, -30
    halign = center
    valign = center
}

input-field {
    monitor =
    font_family = $font
    size = 200, 50
    outline_thickness = 1
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgb(15,15,15)
    inner_color = rgba(255, 255, 255, 0.8)
    font_color = rgb(10, 10, 10)
    fade_on_empty = false
    fade_timeout = 500 # Milliseconds before fade_on_empty is triggered
    placeholder_text = <i>Input Password...</i>   $locked# Text rendered in the input box
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    check_color = rgb(10, 10, 10)
    # check_text = Checking... $check
    fail_color = rgb(245, 37, 37) # if authentication failed, changes outer_color and fail message
    fail_text = $fail $FAIL ($ATTEMPTS) $fail # can be set to empty
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both caps and numlock are on. -1 means no change
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below

    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = $clock $TIME
    text_align = center # center/left/right
    color = rgba(255, 255, 255, 1.0)
    font_size = 45
    font_family = $font
    rotate = 0 # degrees, counter-clockwise

    position = 0, -100
    halign = center
    valign = top
}


# power off btn
shape {
    monitor =
    size = 30, 30
    color = rgba(200, 200, 200, 1.0)
    rounding = 20
    border_size = 2
    border_color = rgba(255, 255, 255, 0.5)

    # Position on your screen
    position = -15, 15
    halign = right
    valign = bottom

    # Command executed when the shape is clicked
    onclick = systemctl poweroff
}

label {
    monitor =
    text = $pwroff
    color = rgb(10, 10, 10)
    font_size = 16
    font_family = $font
    
    position = -23, 20
    halign = right
    valign = bottom
}


# restart btn

shape {
    monitor =
    size = 30, 30
    color = rgba(200, 200, 200, 1.0)
    rounding = 20
    border_size = 2
    border_color = rgba(255, 255, 255, 0.5)

    # Position on your screen
    position = -15, 60
    halign = right
    valign = bottom

    # Command executed when the shape is clicked
    onclick = systemctl reboot
}

label {
    monitor =
    text = $reboot
    color = rgb(10, 10, 10)
    font_size = 16
    font_family = $font
    
    position = -24, 65
    halign = right
    valign = bottom
}

# sleep btn

shape {
    monitor =
    size = 30, 30
    color = rgba(200, 200, 200, 1.0)
    rounding = 20
    border_size = 2
    border_color = rgba(255, 255, 255, 0.5)

    # Position on your screen
    position = -15, 105
    halign = right
    valign = bottom

    # Command executed when the shape is clicked
    onclick = systemctl suspend
}

label {
    monitor =
    text = $sleep
    color = rgb(10, 10, 10)
    font_size = 16
    font_family = $font
    
    position = -24, 110
    halign = right
    valign = bottom
}